services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: darb
      POSTGRES_PASSWORD: darb_secret
      POSTGRES_DB: darb
    ports:
      - "5434:5432"
    volumes:
      - darb_pg_data:/var/lib/postgresql/data

volumes:
  darb_pg_data:
